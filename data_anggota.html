<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Anggota - Perpustakaan Kelas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-cream { background-color: #FDFBF7; }
        .bg-soft-blue { background-color: #E6F0FA; }
        .text-primary-blue { color: #1E3A8A; }
        .bg-primary-blue { background-color: #1E3A8A; }
    </style>
</head>
<body class="bg-cream text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- TOP HEADER -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shadow-sm relative z-20">
        <div class="flex items-center space-x-4">
            <div class="w-12 h-12 bg-soft-blue rounded-lg flex items-center justify-center border border-primary-blue overflow-hidden">
                <img src="https://via.placeholder.com/48?text=LOGO" alt="Logo" class="object-cover w-full h-full">
            </div>
            <h1 class="text-md md:text-lg font-bold text-primary-blue tracking-wide">APLIKASI PEMINJAMAN BUKU PERPUSTAKAAN KELAS</h1>
        </div>
        <div class="flex items-center space-x-4">
            <!-- PENCARIAN ANGGOTA -->
            <div class="relative hidden sm:block">
                <input type="text" id="inputCari" oninput="lakukanPencarian()" placeholder="CARI ANGGOTA..." class="px-4 py-1.5 pl-9 border border-gray-300 rounded-lg text-sm bg-cream focus:outline-none focus:ring-1 focus:ring-blue-800">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
            </div>
            <div onclick="toggleProfilModal()" class="flex items-center space-x-2 bg-soft-blue px-3 py-1.5 rounded-lg border border-blue-200 cursor-pointer hover:bg-blue-100 transition">
                <i class="fa-solid fa-user text-primary-blue"></i>
                <span id="profilName" class="text-sm font-semibold text-primary-blue">PROFIL</span>
            </div>
        </div>
    </header>

    <div class="flex flex-1 relative">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 p-4 space-y-2 transition-all duration-300 absolute md:relative z-10 h-full shadow-md md:shadow-none">
            <div class="flex items-center justify-between mb-4 px-2">
                <button onclick="toggleSidebar()" class="text-primary-blue hover:text-blue-900 focus:outline-none text-xl">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">MENU</span>
            </div>

            <a href="dashboard.html" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-soft-blue text-gray-700 flex items-center space-x-3">
                <i class="fa-solid fa-chart-pie w-5"></i><span>DASHBOARD</span>
            </a>
            <a href="data_anggota.html" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium bg-soft-blue text-primary-blue font-bold flex items-center space-x-3">
                <i class="fa-solid fa-users w-5"></i><span>DATA ANGGOTA</span>
            </a>
            <a href="data_buku.html" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-soft-blue text-gray-700 flex items-center space-x-3">
                <i class="fa-solid fa-book w-5"></i><span>DATA BUKU</span>
            </a>
            
            <div>
                <button onclick="toggleDropdownTransaksi()" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-soft-blue text-gray-700 flex items-center justify-between">
                    <span class="flex items-center space-x-3"><i class="fa-solid fa-right-left w-5"></i><span>TRANSAKSI</span></span>
                    <i id="transaksiArrow" class="fa-solid fa-chevron-down text-xs"></i>
                </button>
                <div id="subTransaksi" class="hidden pl-6 space-y-1 mt-1">
                    <a href="peminjaman.html" class="block px-4 py-2 rounded-lg text-sm text-gray-600 hover:bg-soft-blue hover:text-primary-blue"><i class="fa-solid fa-arrow-up-right-from-square mr-2"></i>PEMINJAMAN</a>
                    <a href="pengembalian.html" class="block px-4 py-2 rounded-lg text-sm text-gray-600 hover:bg-soft-blue hover:text-primary-blue"><i class="fa-solid fa-arrow-rotate-left mr-2"></i>PENGEMBALIAN</a>
                </div>
            </div>

            <div>
                <a href="laporan.html" class="w-full text-left px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-soft-blue text-gray-700 flex items-center space-x-3">
                    <i class="fa-solid fa-file-lines w-5"></i><span>LAPORAN</span>
                </a>
            </div>
            <div class="pt-6">
                <a href="login.html" class="w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 flex items-center space-x-3">
                    <i class="fa-solid fa-right-from-bracket w-5"></i><span>LOGOUT</span>
                </a>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-8 space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-primary-blue">SELAMAT DATANG, <span id="actorName">"ADMIN"</span></h2>
                <button onclick="toggleModalTambahAnggota()" class="bg-primary-blue text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-900 shadow transition">TAMBAH ANGGOTA</button>
            </div>
            <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-soft-blue text-primary-blue border-b border-gray-200">
                            <th class="p-3">NO</th>
                            <th class="p-3">NIM</th>
                            <th class="p-3">NAMA</th>
                            <th class="p-3">KELAS</th>
                            <th class="p-3">STATUS</th>
                            <th class="p-3">AKSI</th>
                        </tr>
                    </thead>
                    <tbody id="tabelAnggota" class="divide-y divide-gray-100 text-sm">
                        <!-- Data Anggota -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL TAMBAH ANGGOTA -->
    <div id="modalTambahAnggota" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-lg shadow-2xl border-2 border-primary-blue">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-xl font-bold text-primary-blue">TAMBAH ANGGOTA</h3>
                <button onclick="toggleModalTambahAnggota()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            </div>
            <form id="formTambahAnggota" onsubmit="tambahAnggota(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">NAMA</label>
                    <input type="text" id="inputNama" required class="w-full px-4 py-2 border border-blue-300 rounded-lg bg-cream focus:outline-none focus:ring-2 focus:ring-blue-800" placeholder="Masukkan nama...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">NIM</label>
                    <input type="text" id="inputNim" required class="w-full px-4 py-2 border border-blue-300 rounded-lg bg-cream focus:outline-none focus:ring-2 focus:ring-blue-800" placeholder="Masukkan NIM...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">KELAS</label>
                    <input type="text" id="inputKelas" required class="w-full px-4 py-2 border border-blue-300 rounded-lg bg-cream focus:outline-none focus:ring-2 focus:ring-blue-800" placeholder="Masukkan kelas...">
                </div>
                <div class="flex space-x-4 pt-2">
                    <button type="reset" class="w-1/2 bg-gray-200 text-gray-700 py-2.5 rounded-lg font-semibold hover:bg-gray-300 transition">RESET</button>
                    <button type="submit" class="w-1/2 bg-primary-blue text-white py-2.5 rounded-lg font-semibold hover:bg-blue-900 transition shadow">SIMPAN</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PROFIL -->
    <div id="profilModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm shadow-xl">
            <h3 class="text-lg font-bold text-primary-blue mb-4">Informasi Profil</h3>
            <p class="text-sm text-gray-600 mb-2">Username Aktif: <strong id="modalUser">Admin</strong></p>
            <button onclick="toggleProfilModal()" class="w-full bg-primary-blue text-white py-2 rounded-lg text-sm font-semibold mt-4">Tutup</button>
        </div>
    </div>

    <script>
        const storedName = localStorage.getItem('namaAktor');
        if(storedName) {
            document.getElementById('actorName').innerText = `"${storedName.toUpperCase()}"`;
            document.getElementById('profilName').innerText = storedName.toUpperCase();
            document.getElementById('modalUser').innerText = storedName;
        }

        let daftarAnggota = JSON.parse(localStorage.getItem('daftarAnggota')) || [
            { nim: '210401', nama: 'Ahmad Fauzi', kelas: 'TI-1A', status: 'Aktif' },
            { nim: '210402', nama: 'Siti Rahma', kelas: 'TI-1A', status: 'Aktif' }
        ];

        function renderTabelAnggota(data = daftarAnggota) {
            const tbody = document.getElementById('tabelAnggota');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">Data tidak ditemukan.</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-3">${index + 1}</td>
                        <td class="p-3">${item.nim}</td>
                        <td class="p-3 font-semibold text-primary-blue">${item.nama}</td>
                        <td class="p-3">${item.kelas}</td>
                        <td class="p-3"><span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">${item.status}</span></td>
                        <td class="p-3 space-x-3 text-lg">
                            <button onclick="editAnggota(${index})" class="text-blue-600 hover:text-blue-800" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="hapusAnggota(${index})" class="text-red-600 hover:text-red-800" title="Hapus"><i class="fa-solid fa-trash-can"></i></button>
                        </td>
                    </tr>
                `;
            });
            localStorage.setItem('daftarAnggota', JSON.stringify(daftarAnggota));
        }

        function lakukanPencarian() {
            const keyword = document.getElementById('inputCari').value.toLowerCase();
            const hasilFilter = daftarAnggota.filter(item => 
                item.nama.toLowerCase().includes(keyword) || 
                item.nim.toLowerCase().includes(keyword) || 
                item.kelas.toLowerCase().includes(keyword)
            );
            renderTabelAnggota(hasilFilter);
        }

        function tambahAnggota(e) {
            e.preventDefault();
            const nama = document.getElementById('inputNama').value;
            const nim = document.getElementById('inputNim').value;
            const kelas = document.getElementById('inputKelas').value;

            daftarAnggota.push({ nim, nama, kelas, status: 'Aktif' });
            renderTabelAnggota();
            toggleModalTambahAnggota();
            document.getElementById('formTambahAnggota').reset();
            alert('Anggota berhasil ditambahkan!');
        }

        function hapusAnggota(index) {
            if(confirm('Yakin ingin menghapus anggota ini?')) {
                daftarAnggota.splice(index, 1);
                renderTabelAnggota();
            }
        }

        function editAnggota(index) {
            const item = daftarAnggota[index];
            const namaBaru = prompt("Edit Nama Anggota:", item.nama);
            if(namaBaru !== null && namaBaru.trim() !== "") {
                daftarAnggota[index].nama = namaBaru;
                renderTabelAnggota();
            }
        }

        function toggleModalTambahAnggota() {
            document.getElementById('modalTambahAnggota').classList.toggle('hidden');
        }
        function toggleDropdownTransaksi() {
            document.getElementById('subTransaksi').classList.toggle('hidden');
            document.getElementById('transaksiArrow').classList.toggle('rotate-180');
        }
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('md:w-64');
            sidebar.classList.toggle('w-16');
        }
        function toggleProfilModal() {
            document.getElementById('profilModal').classList.toggle('hidden');
        }

        renderTabelAnggota();
    </script>
</body>
</html>
